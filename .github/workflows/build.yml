name: Test and publish web demo

# كل دفعة إلى main: يشغّل الاختبارات ثم يبني نسخة ويب قابلة للعب ويرفعها لـ GitHub Pages.
# فعّل: Settings > Pages > Source: GitHub Actions
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/validate_data.py

  test-and-export:
    needs: validate-data
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Setup export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Import project
        run: godot --headless --path . --import || true
      - name: Run logic tests
        run: godot --headless --path . -s tests/run_tests.gd
      - name: Export Web
        run: |
          mkdir -v -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: test-and-export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
