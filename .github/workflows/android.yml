name: Build Android APK (debug, manual)

# تشغيل يدوي فقط: Actions > Build Android APK > Run workflow
# ملاحظة: لم يُجرَّب هذا الملف فعليًا؛ قد يحتاج تعديلات بسيطة حسب نسخة Godot والأدوات.
on:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Godot and export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz -d tpz
          mv tpz/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot || sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
      - name: Debug keystore and editor settings
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOS
      - name: Import and export APK
        run: |
          godot --headless --path . --import || true
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/violet-files.apk
      - uses: actions/upload-artifact@v4
        with:
          name: violet-files-apk
          path: build/violet-files.apk
